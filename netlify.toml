# Netlify Monorepo Configuration for TransFlow TMS
[build]
  base = "TMS"
  publish = ".next"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_PUBLIC_API_URL = "https://tms-production-7db1.up.railway.app/api/v1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
